<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />
  <meta name="theme-color" content="#111827" />
  <title>CampusConnect — Offline</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at top,
          #f8fafc 0,
          #eef2f7 42%,
          #e5e7eb 100%
        );
      color: #111827;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .offlineCard {
      width: min(100%, 460px);
      padding: 38px 30px;
      border: 1px solid rgba(17, 24, 39, 0.08);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow:
        0 24px 70px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    .logo {
      width: 82px;
      height: 82px;
      margin-bottom: 20px;
      border-radius: 22px;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: #64748b;
      line-height: 1.65;
    }

    button {
      margin-top: 26px;
      min-height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 14px;
      background: #111827;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="offlineCard">
    <img
      class="logo"
      src="/campusconnect-logo.png"
      alt="CampusConnect"
    />

    <h1>You're offline</h1>

    <p>
      CampusConnect cannot reach the network right now.
      Reconnect to continue using live campus services.
    </p>

    <button type="button" onclick="location.reload()">
      Try again
    </button>
  </main>
</body>
</html>
